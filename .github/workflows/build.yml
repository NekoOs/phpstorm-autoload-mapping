name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, package, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, build, and verify plugin
        run: >-
          ./gradlew clean test verifyPluginProjectConfiguration
          verifyPluginStructure buildPlugin verifyPlugin --stacktrace

      - name: Record distribution checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one plugin ZIP, found ${#archives[@]}." >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          (
            cd build/distributions
            sha256sum "$archive_name" > SHA256SUMS
          )

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: phpstorm-autoload-mapping-${{ github.sha }}
          path: |
            build/distributions/*.zip
            build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/reports/tests
            build/reports/pluginVerifier
          if-no-files-found: warn
          retention-days: 14
